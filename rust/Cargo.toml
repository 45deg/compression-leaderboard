[package]
name = "compression_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
brotli = "8.0.4"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
js-sys = "0.3.95"
libbz2-rs-sys = { version = "0.2.2", default-features = false, features = ["std"] }
liblzma-sys = { version = "0.4.6", features = ["wasm"] }
lz4_flex = "0.13.0"
lzokay-native = "0.1.0"
snap = "1.1.1"
wasm-bindgen = "0.2.118"
web-sys = { version = "0.3.95", features = ["Performance", "Window", "WorkerGlobalScope"] }
zstd = { version = "0.13.3", default-features = false, features = ["wasm", "experimental"] }
